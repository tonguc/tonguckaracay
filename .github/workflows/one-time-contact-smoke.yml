name: One-time contact form smoke
on:
  push:
    branches:
      - test/contact-endpoint-20261015

jobs:
  send-once:
    if: github.event.head_commit.message == 'FORM_SMOKE_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send one clearly labeled test through production contact API
        run: |
          node - <<'NODE'
          const payload = {
            name: "TEST - ChatGPT SEO Kontrol",
            email: "form-test@example.com",
            service: "Diğer",
            message: "TEST - ChatGPT üzerinden tek seferlik iletişim formu kontrolü. Gerçek müşteri talebi değildir; yanıt gerekmiyor.",
            locale: "tr"
          };
          const response = await fetch("https://tonguckaracay.com/api/contact", {
            method: "POST",
            headers: {"content-type": "application/json"},
            body: JSON.stringify(payload),
            signal: AbortSignal.timeout(15000)
          });
          const body = await response.json().catch(() => ({}));
          console.log(JSON.stringify({status: response.status, accepted: response.ok && body.success === true}));
          if (!response.ok || body.success !== true) process.exitCode = 1;
          NODE
