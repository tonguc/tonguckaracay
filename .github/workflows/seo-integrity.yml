name: SEO integrity
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify blog locale mappings
        run: node --test scripts/seo-p1-blog-hreflang.test.mjs
      - name: Build site
        run: npm run build
