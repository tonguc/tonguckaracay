name: SEO integrity
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify P0 canonical locale routes and robots
        run: node --test scripts/seo-p0-crawl-routes.test.mjs
      - name: Verify GSC legacy legal redirect route
        run: node --test scripts/seo-gsc-5xx-six.test.mjs
      - name: Verify old English on-page SEO canonical redirect
        run: node --test scripts/seo-gsc-onpage-canonical-legacy.test.mjs
      - name: Verify blog locale mappings
        run: node --test scripts/seo-p1-blog-hreflang.test.mjs
      - name: Verify English blog link locale
        run: node --test scripts/seo-en-content-locale.test.mjs
      - name: Verify P2 schema and prototype index policy
        run: node --test scripts/seo-p2-schema.test.mjs
      - name: Verify GA4 lead events and privacy boundaries
        run: node --test scripts/ga4-lead-tracking.test.mjs
      - name: Validate production mail sender config
        run: node --test scripts/contact-resend-config.test.mjs
      - name: Build site
        run: npm run build
      - name: Live production SEO smoke check (diagnostic only)
        continue-on-error: true
        run: node scripts/seo-production-smoke.mjs
      - name: Full sitemap HTTP and canonical audit (diagnostic only)
        continue-on-error: true
        run: node scripts/seo-sitemap-audit.mjs
      - name: Historical GSC 79 URL server and redirect regression
        run: node scripts/seo-historical-gsc-audit.mjs
      - name: Verify six historical GSC 5xx URLs stay healthy
        run: node scripts/seo-gsc-5xx-six-audit.mjs
      - name: Diagnose two GSC Google-selected canonical conflicts
        run: node scripts/seo-gsc-two-google-canonical-audit.mjs
      - name: Live old English canonical alias check (diagnostic before deployment)
        continue-on-error: true
        run: node scripts/seo-gsc-onpage-legacy-live.mjs
      - name: Verify live internal link integrity (all sitemap pages)
        run: node scripts/seo-internal-link-audit.mjs
      - name: Live hreflang and response-header audit (diagnostic only)
        continue-on-error: true
        run: node scripts/seo-live-headers-hreflang-audit.mjs
